services:
  mysql:
    image: mysql:8.0
    container_name: salonflow-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: salonflow
      MYSQL_USER: salonflow
      MYSQL_PASSWORD: salonflow123
    ports:
      - "3306:3306"
    volumes:
      - salonflow-mysql-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  salonflow-mysql-data:
